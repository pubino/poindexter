<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poindexter</title>
<meta name="description" content="Convert beamer PDFs to PowerPoint on macOS.">
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fff; --accent: #0071e3; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #000; --accent: #2997ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; text-align: center; }
  main { padding: 2rem 1rem; max-width: 32rem; }
  h1 { font-size: 2.5rem; margin: 0 0 .25rem; }
  p { color: var(--muted); margin: 0 0 2rem; }
  .download { display: inline-block; padding: .75rem 1.75rem; border-radius: 999px; background: var(--accent);
              color: #fff; font-weight: 600; text-decoration: none; }
  .download:hover { filter: brightness(1.1); }
  small { display: block; margin-top: 1.25rem; color: var(--muted); }
  small a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Poindexter</h1>
  <p>Convert beamer PDFs to PowerPoint.</p>
  <a class="download" href="https://github.com/pubino/poindexter/releases/latest/download/Poindexter.dmg">Download for macOS</a>
  <small>Latest release · macOS 14 or later ·
    <a href="https://github.com/pubino/poindexter/releases">All releases</a> ·
    <a href="https://github.com/pubino/poindexter">Source</a></small>
</main>
</body>
</html>
