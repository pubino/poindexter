name: CI
on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build test convert
      - run: docker compose run --rm test

  macos-app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint xcodegen
      - run: swiftlint lint --strict
      - run: swift test --disable-index-store
      # Compiles the full app (ad-hoc signed). Release signing/notarization is done locally.
      - run: ./scripts/build.sh
