name: CI
on:
  push:
  pull_request:

# Linux runners only: macOS runners are slow. Swift tests and the app build need
# macOS frameworks (PDFKit, AppKit), so they run locally via macos/scripts/test.sh,
# which macos/scripts/release.sh runs before anything is signed or published.
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build test convert
      - run: docker compose run --rm test

  swiftlint:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - run: swiftlint lint --strict
